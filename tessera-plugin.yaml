# Alarm clock: an alarm set on the glass or from Home Assistant, kept on the screen. When it rings the screen wakes and
# shows Snooze and Stop; on a screen with a speaker it beeps. Every name, label and hint is a key into
# translations/<language>.json, part "app".
id: alarm_clock
version: 0.4.0
api: "0.18"
icon: alarm
maintainer: flinty1970
license: MIT
stage: beta
topics: [time]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 24

tiles:
  # The alarm: its time, and when it rings next. A tap opens the card that sets it.
  - id: alarm
    name: tile_name
    icon: alarm
    sizes: { min: 1x1, max: 9x9, full: true }
    memory: 500
    example: tile_example

cards:
  - { id: alarm, name: card_name, wide: true }

# In the top bar: an alarm clock, green with the alarm's time while it is on and grey without a time while it is off.
bar_items:
  - { id: alarm, label: bar_alarm, icon: alarm, example: bar_example }

# The beeps while the alarm rings, on a screen with a speaker (from its board or another plugin): on by default.
parts:
  - { id: sound, file: parts/sound.yaml, label: part_sound, hint: part_sound_hint, features: [speaker], flash_kb: 200, default: true }

# The entities of plugin.yaml, also in the plugin's details on the screen's Plugins tab (each name as an id).
settings:
  - { key: alarm, label: setting_on, hint: setting_on_hint }
  - { key: alarm_hour, label: setting_hour, hint: setting_hour_hint }
  - { key: alarm_minute, label: setting_minute, hint: setting_minute_hint }
  - { key: alarm_days, label: setting_days, hint: setting_days_hint }
  - { key: alarm_snooze_minutes, label: setting_snooze, hint: setting_snooze_hint }
  # Only on a screen with a speaker (the part sound): elsewhere the editor shows it unavailable.
  - { key: alarm_sound, label: setting_sound, hint: setting_sound_hint }
  - { key: alarm_tone, label: setting_tone, hint: setting_tone_hint }
