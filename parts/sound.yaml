# The alarm on the screen's speaker (ts_speaker, the feature speaker): the app builds this part only on a screen that
# has one. A switch turns the sound off and leaves the alarm on the glass and in Home Assistant, and a list chooses
# which of the four sounds rings.
switch:
  - platform: template
    id: alarm_clock_sound_on
    name: "Alarm sound"
    icon: mdi:volume-high
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

# How loud the alarm rings, whatever the screen's volume was left at; that volume comes back when the alarm stops.
# 100 here is 80 % of what the speaker can do: beyond that a small one (4 ohms, 3 watts) distorts.
number:
  - platform: template
    id: alarm_clock_volume
    name: "Alarm volume"
    icon: mdi:volume-high
    min_value: 10
    max_value: 100
    step: 5
    mode: slider
    unit_of_measurement: "%"
    optimistic: true
    initial_value: 100
    restore_value: true
    entity_category: config

select:
  - platform: template
    id: alarm_clock_tone
    name: "Alarm tone"
    icon: mdi:music-note
    optimistic: true
    options:
      - "Beeps"
      - "Gentle chime"
      - "Rising"
      - "Classic alarm"
    initial_option: "Beeps"
    restore_value: true
    entity_category: config

alarm_clock:
  speaker: ts_speaker
  sound_on: alarm_clock_sound_on
  volume: alarm_clock_volume
  tone: alarm_clock_tone
